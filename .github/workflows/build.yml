name: Build

# One job builds every Minecraft version for every loader (Stonecutter nodes), runs the tests and publishes
# the jars as a GitHub release named after the pushed version tag. A manual run only builds and uploads them.
on:
  push:
    tags: ['*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Gradle runs on Java 21 (the last one listed becomes JAVA_HOME); 26.x nodes compile with the Java 25 toolchain.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            25
            21

      - uses: gradle/actions/setup-gradle@v4

      # ForgeGradle's Mavenizer decompiles and patches each Forge version once; keep the result between runs.
      - uses: actions/cache@v4
        with:
          path: |
            .gradle/mavenizer
            ~/.gradle/caches/minecraftforge
          key: forge-mavenizer-${{ hashFiles('versions/*.properties') }}

      - name: Build and test
        run: >
          ./gradlew build
          -Porg.gradle.java.installations.fromEnv=JAVA_HOME_21_X64,JAVA_HOME_25_X64
          ${{ startsWith(github.ref, 'refs/tags/') && format('-Pversion={0}', github.ref_name) || '' }}

      - name: Collect jars
        run: |
          mkdir dist
          cp {fabric,neoforge,forge}/versions/*/build/libs/*+*.jar dist/
          rm -f dist/*-sources.jar
          ls -l dist

      - uses: actions/upload-artifact@v4
        with:
          name: minecraft-mcp
          path: dist/*.jar

      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.jar
          generate_release_notes: true
